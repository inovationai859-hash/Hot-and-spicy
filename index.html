    <script>

          var canonicalLink = document.querySelector('link[rel="canonical"]');
          if (canonicalLink) canonicalLink.setAttribute('href', canonicalUrl);

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', canonicalUrl);

          var ogImgs = document.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"]');
          for (var i = 0; i < ogImgs.length; i++) {
            var current = ogImgs[i].getAttribute('content') || '';
            var asset = current.indexOf('og-lounge.jpg') !== -1 ? '/og-lounge.jpg' : '/og-share.jpg';
            ogImgs[i].setAttribute('content', origin + asset);

          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', origin + '/og-share.jpg');

          var schemaEl = document.getElementById('hs-restaurant-schema');
          if (schemaEl && schemaEl.textContent) {
            var baseHost = 'https://hotandspicybansberia.in';
            var rewriteUrls = function (node) {
              if (typeof node === 'string') {
                return node.indexOf(baseHost) === 0 ? origin + node.slice(baseHost.length) : node;

              if (Array.isArray(node)) {
                return node.map(rewriteUrls);

              if (node && typeof node === 'object') {

                for (var k = 0; k < keys.length; k++) {
